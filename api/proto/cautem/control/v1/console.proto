syntax = "proto3";

package cautem.control.v1;

option go_package = "github.com/cautem/cautem-gateway/api/gen/cautem/control/v1;controlv1";

// ConsoleService provides safe, user-facing gateway summary methods.
service ConsoleService {
  // GetViewer returns the authenticated user without credentials or tokens.
  rpc GetViewer(GetViewerRequest) returns (GetViewerResponse);

  // GetConsoleCapabilities reports features available on this gateway.
  rpc GetConsoleCapabilities(GetConsoleCapabilitiesRequest) returns (GetConsoleCapabilitiesResponse);

  // GetOverview returns an authorized summary for one workspace.
  rpc GetOverview(GetOverviewRequest) returns (GetOverviewResponse);
}

// GatewayAdminService exposes explicitly authorized gateway diagnostics.
service GatewayAdminService {
  rpc GetGatewayInfo(GetGatewayInfoRequest) returns (GetGatewayInfoResponse);
}
message GetGatewayInfoRequest {}
message GetGatewayInfoResponse {
  string gateway_id = 1;
  uint64 sandbox_count = 2;
  string auth_mode = 3;
  repeated ComputeDriverStatus compute_drivers = 4;
  repeated string credential_drivers = 5;
  string default_credential_driver = 6;
  bool allow_unauthenticated = 7;
  string oidc_issuer = 8;
  int64 ssh_session_ttl_seconds = 9;
  string secrets_kek_source = 10;
  bool secrets_kek_pinned = 11;
  string secrets_kek_warning = 12;
  string secrets_kek_format = 13;
  bool secrets_kek_migration_needed = 14;
}
message ComputeDriverStatus { string name = 1; string state = 2; }

// SandboxService provides user-facing sandbox inventory methods.
service SandboxService {
  // ListSandboxes returns a bounded page of one workspace's sandbox records.
  rpc ListSandboxes(ListSandboxesRequest) returns (ListSandboxesResponse);

  // GetSandbox returns one sandbox record visible to the caller.
  rpc GetSandbox(GetSandboxRequest) returns (GetSandboxResponse);

  // WatchSandboxes begins with a full reset/snapshot and then sends changes.
  // Reconnect by opening a new stream and replacing the prior client state.
  rpc WatchSandboxes(WatchSandboxesRequest) returns (stream WatchSandboxesResponse);

  // GetSandboxLogs returns a bounded tail of one visible sandbox's log buffer.
  rpc GetSandboxLogs(GetSandboxLogsRequest) returns (GetSandboxLogsResponse);
  // Append bounded observations from an authorized user or matching sandbox token.
  rpc AppendSandboxLogs(AppendSandboxLogsRequest) returns (AppendSandboxLogsResponse);

  // WatchSandboxLogs starts with a tail and then follows new buffered lines.
  rpc WatchSandboxLogs(WatchSandboxLogsRequest) returns (stream WatchSandboxLogsResponse);

  // These actions execute against the configured runtime, never the REST registry.
  rpc CreateSandbox(CreateSandboxRequest) returns (CreateSandboxResponse);
  rpc StartSandbox(StartSandboxRequest) returns (StartSandboxResponse);
  rpc StopSandbox(StopSandboxRequest) returns (StopSandboxResponse);
  rpc DeleteSandbox(DeleteSandboxRequest) returns (DeleteSandboxResponse);
}

// ManagedSandboxService records sandboxes whose runtime is controlled by the CLI.
// It never provisions or deletes the underlying compute runtime.
service ManagedSandboxService {
  rpc SyncManagedSandbox(SyncManagedSandboxRequest) returns (SyncManagedSandboxResponse);
  rpc GetManagedSandbox(GetManagedSandboxRequest) returns (GetManagedSandboxResponse);
  rpc DeleteManagedSandbox(DeleteManagedSandboxRequest) returns (DeleteManagedSandboxResponse);
  rpc IssueManagedSandboxToken(IssueManagedSandboxTokenRequest) returns (IssueManagedSandboxTokenResponse);
}

message GetManagedSandboxRequest { string workspace = 1; string name = 2; }
message GetManagedSandboxResponse {
  string name = 1;
  string runtime_id = 2;
  string image = 3;
  string workspace = 4;
  string network = 5;
  string status = 6;
  map<string, string> labels = 7;
  string base_policy_yaml = 8;
  repeated string attached_providers = 9;
  uint64 resource_version = 10;
}

message SyncManagedSandboxRequest {
  string workspace = 1;
  string name = 2;
  string runtime_id = 3;
  string image = 4;
  string network = 5;
  string status = 6;
  map<string, string> labels = 7;
  string base_policy_yaml = 8;
  repeated string attached_providers = 9;
}
message SyncManagedSandboxResponse { uint64 resource_version = 1; }
message DeleteManagedSandboxRequest { string workspace = 1; string name = 2; }
message DeleteManagedSandboxResponse { bool deleted = 1; }
message IssueManagedSandboxTokenRequest { string workspace = 1; string name = 2; }
message IssueManagedSandboxTokenResponse { string token = 1; }

message AppendSandboxLogsRequest {
  string workspace = 1;
  string sandbox_name = 2;
  repeated ClientLogLine lines = 3;
}
message ClientLogLine {
  int64 timestamp_unix_ms = 1;
  string source = 2;
  string level = 3;
  string text = 4;
}
message AppendSandboxLogsResponse { uint32 accepted = 1; }

// OperationsService lets a user reconcile a mutation after a lost response.
service OperationsService {
  rpc GetOperation(GetOperationRequest) returns (GetOperationResponse);
  rpc ListOperations(ListOperationsRequest) returns (ListOperationsResponse);
  rpc ListAuditEvents(ListAuditEventsRequest) returns (ListAuditEventsResponse);
}

// CatalogService exposes workspace-visible service and workload metadata.
service CatalogService {
  rpc ListServices(ListServicesRequest) returns (ListServicesResponse);
  rpc ListTemplates(ListTemplatesRequest) returns (ListTemplatesResponse);
  rpc ListWorkspaces(ListWorkspacesRequest) returns (ListWorkspacesResponse);
  rpc GetWorkspace(GetWorkspaceRequest) returns (GetWorkspaceResponse);
}

// InferenceService manages the gateway-wide inference.local route.
service InferenceService {
  rpc GetInferenceRoute(GetInferenceRouteRequest) returns (GetInferenceRouteResponse);
  rpc UpdateInferenceRoute(UpdateInferenceRouteRequest) returns (UpdateInferenceRouteResponse);
  rpc ClearInferenceRoute(ClearInferenceRouteRequest) returns (ClearInferenceRouteResponse);
}

message GetInferenceRouteRequest {}
message GetInferenceRouteResponse {
  string provider = 1;
  string model = 2;
  int32 timeout_sec = 3;
  uint64 resource_version = 4;
}
message UpdateInferenceRouteRequest {
  string provider = 1;
  string model = 2;
  int32 timeout_sec = 3;
  uint64 expected_resource_version = 4;
}
message UpdateInferenceRouteResponse {
  uint64 resource_version = 1;
}
message ClearInferenceRouteRequest {
  uint64 expected_resource_version = 1;
}
message ClearInferenceRouteResponse {
  bool cleared = 1;
}

service PolicyService {
  rpc GetGlobalPolicy(GetGlobalPolicyRequest) returns (GetGlobalPolicyResponse);
  rpc UpdateGlobalPolicy(UpdateGlobalPolicyRequest) returns (UpdateGlobalPolicyResponse);
  rpc GetSandboxPolicy(GetSandboxPolicyRequest) returns (GetSandboxPolicyResponse);
  rpc UpdateSandboxPolicy(UpdateSandboxPolicyRequest) returns (UpdateSandboxPolicyResponse);
  rpc ListSandboxPolicyRevisions(ListSandboxPolicyRevisionsRequest) returns (ListSandboxPolicyRevisionsResponse);
  rpc GetSandboxPolicyRevision(GetSandboxPolicyRevisionRequest) returns (GetSandboxPolicyRevisionResponse);
  rpc ListPolicyProposals(ListPolicyProposalsRequest) returns (ListPolicyProposalsResponse);
  rpc GetPolicyProposal(GetPolicyProposalRequest) returns (GetPolicyProposalResponse);
  rpc ApprovePolicyProposal(ApprovePolicyProposalRequest) returns (ApprovePolicyProposalResponse);
  rpc RejectPolicyProposal(RejectPolicyProposalRequest) returns (RejectPolicyProposalResponse);
}

message GetGlobalPolicyRequest {}
message GetGlobalPolicyResponse {
  string policy_yaml = 1;
  uint64 resource_version = 2;
}
message UpdateGlobalPolicyRequest {
  string policy_yaml = 1;
  uint64 expected_resource_version = 2;
  bool clear = 3;
}
message UpdateGlobalPolicyResponse {
  uint64 resource_version = 1;
}

message GetSandboxPolicyRequest {
  string workspace = 1;
  string sandbox_name = 2;
  // "base" returns the editable layer; "full" returns the composed policy.
  string view = 3;
}
message GetSandboxPolicyResponse {
  string policy_yaml = 1;
  uint64 resource_version = 2;
  uint64 policy_revision = 3;
}
message UpdateSandboxPolicyRequest {
  string workspace = 1;
  string sandbox_name = 2;
  string base_policy_yaml = 3;
  uint64 expected_policy_revision = 4;
}
message UpdateSandboxPolicyResponse {
  string effective_policy_yaml = 1;
  uint32 stripped_provider_rules = 2;
  uint64 policy_revision = 3;
}
message ListSandboxPolicyRevisionsRequest {
  string workspace = 1;
  string sandbox_name = 2;
}
message ListSandboxPolicyRevisionsResponse {
  repeated PolicyRevisionSummary revisions = 1;
}
message GetSandboxPolicyRevisionRequest {
  string workspace = 1;
  string sandbox_name = 2;
  uint64 revision = 3;
}
message GetSandboxPolicyRevisionResponse {
  string policy_yaml = 1;
  PolicyRevisionSummary revision = 2;
}
message PolicyRevisionSummary {
  uint64 revision = 1;
  int64 updated_at_unix_ms = 2;
  uint32 bytes = 3;
  string status = 4;
}

// ProviderProfileService preserves the full cautem profile document while
// keeping profile management inside the authenticated client API.
service ProviderProfileService {
  rpc ListProviderProfiles(ListProviderProfilesRequest) returns (ListProviderProfilesResponse);
  rpc GetProviderProfile(GetProviderProfileRequest) returns (GetProviderProfileResponse);
  rpc ImportProviderProfile(ImportProviderProfileRequest) returns (ImportProviderProfileResponse);
  rpc UpdateProviderProfile(UpdateProviderProfileRequest) returns (UpdateProviderProfileResponse);
  rpc DeleteProviderProfile(DeleteProviderProfileRequest) returns (DeleteProviderProfileResponse);
}

// ProviderCredentialService handles cautem-only secret patch semantics.
// OpenShell Provider.Update replaces the full credential map, so partial
// updates stay behind this narrow authenticated method.
service ProviderCredentialService {
  rpc UpdateProviderCredentials(UpdateProviderCredentialsRequest) returns (UpdateProviderCredentialsResponse);
}

message UpdateProviderCredentialsRequest {
  string workspace = 1;
  string provider_name = 2;
  map<string, string> credentials = 3;
}

message UpdateProviderCredentialsResponse {
  repeated string updated_keys = 1;
}

message ListProviderProfilesRequest {
  // Empty selects built-in and platform profiles; otherwise select a workspace.
  string workspace = 1;
}

message ProviderProfileSummary {
  string id = 1;
  string category = 2;
  string source = 3;
  string scope = 4;
  uint64 resource_version = 5;
}

message ListProviderProfilesResponse {
  repeated ProviderProfileSummary profiles = 1;
}

message GetProviderProfileRequest {
  string workspace = 1;
  string id = 2;
}

message GetProviderProfileResponse {
  string profile_yaml = 1;
  string source = 2;
  uint64 resource_version = 3;
}

message ImportProviderProfileRequest {
  string workspace = 1;
  string profile_yaml = 2;
  string id = 3;
}

message ImportProviderProfileResponse {
  string imported_id = 1;
}

message UpdateProviderProfileRequest {
  string workspace = 1;
  string id = 2;
  uint64 expected_resource_version = 3;
  string profile_yaml = 4;
}

message UpdateProviderProfileResponse {
  uint64 resource_version = 1;
}

message DeleteProviderProfileRequest {
  string workspace = 1;
  string id = 2;
}

message DeleteProviderProfileResponse {
  bool deleted = 1;
}

message GetViewerRequest {}

message GetViewerResponse {
  string subject = 1;
  repeated string roles = 2;
  repeated string scopes = 3;
  string identity_provider = 4;
}

message GetConsoleCapabilitiesRequest {}

message GetConsoleCapabilitiesResponse {
  // These fields describe deployed features, not user authorization.
  bool sandbox_lifecycle_available = 1;
  bool sandbox_watch_available = 2;
  repeated string compute_drivers = 3;
}

message GetOverviewRequest {
  // Empty selects the default workspace.
  string workspace = 1;
}

message GetOverviewResponse {
  string gateway_id = 1;
  string workspace = 2;
  uint64 sandbox_count = 3;
  uint64 registry_running_count = 4;
  int64 snapshot_at_unix_ms = 5;
  // False until runtime state is joined into the overview.
  bool runtime_status_available = 6;
}

message ListSandboxesRequest {
  // Empty selects the default workspace. Cross-workspace lists are excluded.
  string workspace = 1;
  // Zero selects the server default. The server applies a maximum.
  uint32 page_size = 2;
  // Opaque cursor returned by the preceding page.
  string page_token = 3;
  string name_prefix = 4;
  string registry_status = 5;
  string compute_driver = 6;
  map<string, string> labels = 7;
}

message ListSandboxesResponse {
  repeated SandboxSummary sandboxes = 1;
  string next_page_token = 2;
}

message GetSandboxRequest {
  // Empty selects the default workspace.
  string workspace = 1;
  string name = 2;
}

message GetSandboxResponse {
  SandboxSummary sandbox = 1;
}

message WatchSandboxesRequest {
  // Empty selects the default workspace.
  string workspace = 1;
}

enum SandboxWatchEventKind {
  SANDBOX_WATCH_EVENT_KIND_UNSPECIFIED = 0;
  SANDBOX_WATCH_EVENT_KIND_RESET = 1;
  SANDBOX_WATCH_EVENT_KIND_UPSERT = 2;
  SANDBOX_WATCH_EVENT_KIND_DELETE = 3;
  SANDBOX_WATCH_EVENT_KIND_SYNCED = 4;
  SANDBOX_WATCH_EVENT_KIND_HEARTBEAT = 5;
}

message WatchSandboxesResponse {
  SandboxWatchEventKind kind = 1;
  // Sequence numbers start at one for each stream and are not durable cursors.
  uint64 stream_sequence = 2;
  SandboxSummary sandbox = 3;
  string deleted_name = 4;
  int64 observed_at_unix_ms = 5;
}

message GetSandboxLogsRequest {
  string workspace = 1;
  string name = 2;
  // Zero selects 200 lines; the server caps requests at 1000.
  uint32 limit = 3;
  // Return entries at or after this Unix timestamp. Zero disables the filter.
  int64 since_unix_ms = 4;
  // Exact source filter, such as "proxy" or "sandbox".
  string source = 5;
  // Level filter with the gateway log buffer's existing level matching rules.
  string level = 6;
}

message GetSandboxLogsResponse {
  repeated SandboxLogLine lines = 1;
  // Latest buffered sequence; cursors are scoped to this in-memory buffer.
  uint64 cursor = 2;
}

message WatchSandboxLogsRequest {
  string workspace = 1;
  string name = 2;
  // Zero selects 200 lines; the server caps requests at 1000.
  uint32 initial_limit = 3;
  // Zero starts with a fresh tail. An expired or future cursor causes RESET.
  uint64 after_cursor = 4;
  // Return only lines at or after this Unix timestamp. Zero disables the filter.
  int64 since_unix_ms = 5;
  // Optional exact source filter.
  string source = 6;
  // Optional level filter using the gateway's existing matching rules.
  string level = 7;
}

enum SandboxLogWatchKind {
  SANDBOX_LOG_WATCH_KIND_UNSPECIFIED = 0;
  SANDBOX_LOG_WATCH_KIND_RESET = 1;
  SANDBOX_LOG_WATCH_KIND_LINE = 2;
  SANDBOX_LOG_WATCH_KIND_HEARTBEAT = 3;
}

message WatchSandboxLogsResponse {
  SandboxLogWatchKind kind = 1;
  SandboxLogLine line = 2;
  // Resume cursor at a reset or heartbeat. RESET precedes a bounded tail.
  uint64 cursor = 3;
  int64 observed_at_unix_ms = 4;
}

// Log text may contain application output. Only authorized workspace users may read it.
// Structured fields are omitted because they may carry credential material.
message SandboxLogLine {
  uint64 cursor = 1;
  int64 timestamp_unix_ms = 2;
  string source = 3;
  string level = 4;
  string target = 5;
  string message = 6;
}

message CreateSandboxRequest {
  string workspace = 1;
  // Required, DNS label up to 19 bytes. This is a gateway-wide unique name.
  string name = 2;
  // Choose either an image or an existing workspace workload template.
  string image = 3;
  string workload_template_name = 4;
  repeated string command = 5;
  // Required client-generated ID, reused verbatim for retries.
  string request_id = 6;
  map<string, string> labels = 7;
}

message CreateSandboxResponse {
  // Returned after the backend and registry transition complete.
  SandboxSummary sandbox = 1;
  bool completed = 2;
  string operation_id = 3;
}

message StartSandboxRequest {
  string workspace = 1;
  string name = 2;
  // Required. Rejects a stale UI action before backend side effects.
  uint64 expected_resource_version = 3;
  string request_id = 4;
}

message StartSandboxResponse {
  // Returned only after the backend call and registry transition complete.
  SandboxSummary sandbox = 1;
  bool completed = 2;
  string operation_id = 3;
}

message StopSandboxRequest {
  string workspace = 1;
  string name = 2;
  uint64 expected_resource_version = 3;
  string request_id = 4;
}

message StopSandboxResponse {
  SandboxSummary sandbox = 1;
  bool completed = 2;
  string operation_id = 3;
}

message DeleteSandboxRequest {
  string workspace = 1;
  string name = 2;
  uint64 expected_resource_version = 3;
  string request_id = 4;
}

message DeleteSandboxResponse {
  // True only after the backend and registry removal complete.
  bool deleted = 1;
  string operation_id = 2;
}

message GetOperationRequest {
  string workspace = 1;
  // Query by the client-generated ID even when the mutation response was lost.
  string request_id = 2;
}

message GetOperationResponse {
  OperationSummary operation = 1;
}

message ListOperationsRequest {
  string workspace = 1;
  uint64 after_number = 2;
  uint32 limit = 3;
}

message ListOperationsResponse {
  repeated OperationSummary operations = 1;
  uint64 next_after_number = 2;
}

message ListAuditEventsRequest {
  string workspace = 1;
  uint64 after_id = 2;
  uint32 limit = 3;
}

message ListAuditEventsResponse {
  repeated AuditEventSummary events = 1;
  uint64 next_after_id = 2;
}

message OperationSummary {
  string id = 1;
  uint64 number = 2;
  string request_id = 3;
  string actor = 4;
  string workspace = 5;
  string sandbox = 6;
  string action = 7;
  // running, succeeded, failed, or uncertain.
  string state = 8;
  string error_code = 9;
  string result_registry_status = 10;
  uint64 result_resource_version = 11;
  int64 created_at_unix_ms = 12;
  int64 updated_at_unix_ms = 13;
}

message AuditEventSummary {
  uint64 id = 1;
  int64 timestamp_unix_ms = 2;
  string actor = 3;
  string action = 4;
  string workspace = 5;
  string sandbox = 6;
  string outcome = 7;
  string code = 8;
}

// SandboxSummary intentionally excludes spec JSON, settings, secrets, and tokens.
message SandboxSummary {
  string name = 1;
  string workspace = 2;
  string registry_status = 3;
  string compute_driver = 4;
  uint64 resource_version = 5;
  int64 updated_at_unix_ms = 6;
  // False until the runtime's observed state is joined into this view.
  bool runtime_status_available = 7;
  string id = 8;
  string image = 9;
  map<string, string> labels = 10;
}

message ListServicesRequest {
  string workspace = 1;
}

message ListServicesResponse {
  repeated ServiceSummary services = 1;
}

message ServiceSummary {
  string name = 1;
  string sandbox_name = 2;
  uint32 port = 3;
  int64 updated_at_unix_ms = 4;
}

message ListTemplatesRequest {
  string workspace = 1;
}

message ListTemplatesResponse {
  repeated TemplateSummary templates = 1;
}

message TemplateSummary {
  string name = 1;
  string workspace = 2;
  string image = 3;
  repeated string providers = 4;
  uint64 resource_version = 5;
  int64 created_at_unix_ms = 6;
}

message ListWorkspacesRequest {}

message ListWorkspacesResponse {
  repeated WorkspaceSummary workspaces = 1;
}

message GetWorkspaceRequest {
  string name = 1;
}

message GetWorkspaceResponse {
  WorkspaceSummary workspace = 1;
}

message WorkspaceSummary {
  string name = 1;
  string caller_role = 2;
  uint32 member_count = 3;
  uint64 resource_version = 4;
  int64 updated_at_unix_ms = 5;
}

message ListPolicyProposalsRequest {
  string workspace = 1;
  string sandbox_name = 2;
  string status = 3;
  uint32 page_size = 4;
  string after_id = 5;
}

message ListPolicyProposalsResponse {
  repeated PolicyProposalSummary proposals = 1;
  string next_after_id = 2;
}

message GetPolicyProposalRequest {
  string workspace = 1;
  string id = 2;
}

message GetPolicyProposalResponse {
  PolicyProposalSummary proposal = 1;
}

message ApprovePolicyProposalResponse {
  PolicyProposalSummary proposal = 1;
}

message RejectPolicyProposalResponse {
  PolicyProposalSummary proposal = 1;
}

message ApprovePolicyProposalRequest {
  string workspace = 1;
  string id = 2;
}

message RejectPolicyProposalRequest {
  string workspace = 1;
  string id = 2;
  string reason = 3;
}

message PolicyProposalSummary {
  string id = 1;
  string sandbox_name = 2;
  string status = 3;
  string intent_summary = 4;
  string rule_name = 5;
  string rule_yaml = 6;
  string rationale = 7;
  string security_notes = 8;
  float confidence = 9;
  repeated string hosts = 10;
  string rejection_reason = 11;
  string validation_result = 12;
  bool security_flagged = 13;
  int64 created_at_unix_ms = 14;
  int64 decided_at_unix_ms = 15;
}
