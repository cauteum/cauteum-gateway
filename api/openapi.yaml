openapi: 3.1.0
info:
  title: Cauteum Gateway REST API
  version: 0.1.0
  summary: Client-facing contract for the gateway control-plane REST API.
  description: >-
    This specification documents the client-facing REST control-plane surface:
    health, gateway metadata, sandbox registry, logs, policy proposals,
    providers, workspaces, services, templates, settings, inference, and local
    or OIDC authentication configuration. Operational probes, diagnostics,
    streaming relay transports, compatibility aliases, and RPC are excluded.
    Sandbox registry writes do not provision or stop a compute runtime; runtime
    lifecycle operations are defined by the OpenShell RPC contract.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: http://127.0.0.1:7443
    description: Local development gateway. Configure HTTPS for remote use.
tags:
  - name: Health
    description: Liveness checks for the gateway process.
  - name: Gateway
    description: Authenticated gateway metadata.
  - name: Sandboxes
    description: Sandbox registry records. Runtime lifecycle uses OpenShell RPC.
  - name: Logs
    description: Snapshot and streaming access to gateway log buffers.
  - name: Policy
    description: Global policy configuration.
  - name: Providers
    description: Provider instances and sandbox attachments.
  - name: Workspaces
    description: Workspace records and membership.
  - name: Services
    description: Services exposed by registered sandboxes.
  - name: Configuration
    description: Gateway settings, templates, and inference routing.
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      operationId: healthz
      tags: [Health]
      summary: Check gateway liveness
      security: []
      responses:
        '200':
          description: Gateway is live.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /v1/info:
    get:
      operationId: getGatewayInfo
      tags: [Gateway]
      summary: Read gateway metadata
      description: Requires config:read when OIDC scope authorization is enabled.
      responses:
        '200':
          description: Gateway metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/sandboxes:
    get:
      operationId: listSandboxRecords
      tags: [Sandboxes]
      summary: List sandbox registry records
      description: Requires sandbox:read when OIDC scope authorization is enabled.
      responses:
        '200':
          description: Registered sandboxes.
          content:
            application/json:
              schema:
                type: object
                required: [sandboxes]
                properties:
                  sandboxes:
                    type: array
                    items:
                      $ref: '#/components/schemas/SandboxRecord'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/sandboxes/{name}:
    parameters:
      - $ref: '#/components/parameters/SandboxName'
    get:
      operationId: getSandboxRecord
      tags: [Sandboxes]
      summary: Get a sandbox registry record
      description: Requires sandbox:read when OIDC scope authorization is enabled.
      responses:
        '200':
          description: Registered sandbox.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxRecord'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: upsertSandboxRecord
      tags: [Sandboxes]
      summary: Upsert a sandbox registry record
      description: >-
        Writes registry metadata only. This operation does not create or start
        a sandbox runtime. Requires sandbox:write when OIDC scope authorization
        is enabled.
      requestBody:
        required: true
        content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sandbox'
      responses:
        '204':
          description: Registry record was saved.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      operationId: deleteSandboxRecord
      tags: [Sandboxes]
      summary: Delete a sandbox registry record
      description: >-
        Removes the registry record and associated gateway relay state. It does
        not stop or remove a compute runtime. Requires sandbox:write when OIDC
        scope authorization is enabled.
      responses:
        '204':
          description: Registry record was removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/sandboxes/{name}/logs:
    parameters:
      - $ref: '#/components/parameters/SandboxName'
    get:
      operationId: getSandboxLogs
      tags: [Logs]
      summary: Read or follow one sandbox's logs
      description: >-
        With follow=true the response is a Server-Sent Events stream. Otherwise
        it returns a snapshot of up to 500 lines. A sandbox
        supervisor bearer may only read logs for its own sandbox.
      parameters:
        - name: since
          in: query
          required: false
          description: RFC3339 timestamp or Go duration such as 10m.
          schema:
            type: string
        - name: source
          in: query
          required: false
          schema:
            type: string
        - name: level
          in: query
          required: false
          schema:
            type: string
        - name: follow
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Log snapshot or live event stream.
          content:
            application/json:
              schema:
                type: object
                required: [lines]
                properties:
                  lines:
                    type: array
                    items:
                      $ref: '#/components/schemas/LogLine'
            text/event-stream:
              schema:
                type: string
                description: SSE events whose data contains formatted log lines.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: appendSandboxLogs
      tags: [Logs]
      summary: Append sandbox log entries
      description: >-
        Used by a sandbox component to report observations. Supervisor bearer
        tokens may write only to their own sandbox.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lines]
              properties:
                lines:
                  type: array
                  items:
                    $ref: '#/components/schemas/LogLine'
      responses:
        '204':
          description: Log entries were accepted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/sandboxes/{name}/exec:
    parameters:
      - $ref: '#/components/parameters/SandboxName'
    post:
      operationId: execInSandbox
      tags: [Sandboxes]
      summary: Run a command through the sandbox relay
      description: Runs argv in an already registered sandbox with a connected supervisor. Requires sandbox:write when OIDC scope authorization is enabled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [argv]
              properties:
                argv:
                  type: array
                  minItems: 1
                  items:
                    type: string
      responses:
        '200':
          description: Command result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          description: Sandbox relay is not connected.
          content:
            text/plain:
              schema:
                type: string
  /v1/sandboxes/{name}/secrets:
    parameters:
      - $ref: '#/components/parameters/SandboxName'
    get:
      operationId: resolveSandboxSecrets
      tags: [Providers]
      summary: Resolve credentials for attached providers
      description: >-
        Returns raw secret values for the sandbox sidecar. Treat the response
        as highly sensitive; never log, cache, or expose it to an end user.
      responses:
        '200':
          description: Resolved key/value secrets.
          content:
            application/json:
              schema:
                type: object
                required: [secrets]
                properties:
                  secrets:
                    type: object
                    additionalProperties:
                      type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/sandboxes/{name}/providers:
    parameters:
      - $ref: '#/components/parameters/SandboxName'
    get:
      operationId: listSandboxProviders
      tags: [Providers]
      summary: List providers attached to a sandbox
      responses:
        '200':
          description: Attached provider metadata.
          content:
            application/json:
              schema:
                type: object
                required: [providers]
                properties:
                  providers:
                    type: array
                    items:
                      $ref: '#/components/schemas/SandboxProvider'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/sandboxes/{name}/providers/{provider}:
    parameters:
      - $ref: '#/components/parameters/SandboxName'
      - name: provider
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: attachProviderToSandbox
      tags: [Providers]
      summary: Attach a provider to a sandbox
      responses:
        '204':
          description: Provider was attached.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: detachProviderFromSandbox
      tags: [Providers]
      summary: Detach a provider from a sandbox
      responses:
        '204':
          description: Provider was detached.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/sandboxes/{name}/ssh-session:
    parameters:
      - $ref: '#/components/parameters/SandboxName'
    post:
      operationId: createSshSession
      tags: [Sandboxes]
      summary: Create an SSH session for a sandbox
      description: Requires a connected supervisor. The session token is returned once and must be handled as a secret.
      responses:
        '200':
          description: SSH connection details and one-time session token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SSHSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          description: Sandbox relay is not connected.
          content:
            text/plain:
              schema:
                type: string
  /v1/sandboxes/{name}/supervisor-token:
    parameters:
      - $ref: '#/components/parameters/SandboxName'
    post:
      operationId: rotateSupervisorToken
      tags: [Sandboxes]
      summary: Rotate a sandbox supervisor token
      description: Returns the new supervisor bearer once. Store it as a secret; the previous token is invalidated.
      responses:
        '200':
          description: New one-time supervisor token.
          content:
            application/json:
              schema:
                type: object
                required: [sandbox, sandbox_token]
                properties:
                  sandbox:
                    type: string
                  sandbox_token:
                    type: string
                    format: password
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/sandboxes/{name}/proposals:
    parameters:
      - $ref: '#/components/parameters/SandboxName'
    get:
      operationId: listSandboxProposals
      tags: [Policy]
      summary: List policy proposals
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, approved, rejected]
      responses:
        '200':
          description: Proposals for the sandbox.
          content:
            application/json:
              schema:
                type: object
                required: [proposals]
                properties:
                  proposals:
                    type: array
                    items:
                      $ref: '#/components/schemas/Proposal'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createSandboxProposal
      tags: [Policy]
      summary: Submit a policy proposal
      description: Gateway marks every submitted proposal as security flagged pending operator review.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProposalInput'
      responses:
        '202':
          description: Proposal accepted for review.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proposal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/sandboxes/{name}/proposals/{proposalId}:
    parameters:
      - $ref: '#/components/parameters/SandboxName'
      - name: proposalId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getSandboxProposal
      tags: [Policy]
      summary: Read a policy proposal
      responses:
        '200':
          description: Policy proposal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proposal'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/sandboxes/{name}/proposals/{proposalId}/approve:
    parameters:
      - $ref: '#/components/parameters/SandboxName'
      - name: proposalId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: approveSandboxProposal
      tags: [Policy]
      summary: Approve a policy proposal
      description: Merges the proposal into the sandbox base policy after validation.
      responses:
        '200':
          description: Approved proposal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proposal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/sandboxes/{name}/proposals/{proposalId}/reject:
    parameters:
      - $ref: '#/components/parameters/SandboxName'
      - name: proposalId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: rejectSandboxProposal
      tags: [Policy]
      summary: Reject a policy proposal
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Rejected proposal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proposal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/logs:
    get:
      operationId: getFleetLogs
      tags: [Logs]
      summary: Read or follow sandbox logs
      description: >-
        Supply one or more name values, or set all=true. With follow=true the
        response is a Server-Sent Events stream. Without follow, the response
        contains at most the latest 200 lines per sandbox.
      parameters:
        - name: name
          in: query
          required: false
          description: Sandbox name. May be repeated to select multiple sandboxes.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: all
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: follow
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Log snapshot or live event stream.
          content:
            application/json:
              schema:
                type: object
                required: [lines]
                properties:
                  lines:
                    type: array
                    items:
                      type: object
                      required: [sandbox, line]
                      properties:
                        sandbox:
                          type: string
                        line:
                          $ref: '#/components/schemas/LogLine'
            text/event-stream:
              schema:
                type: string
                description: SSE events whose data contains formatted log lines.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/providers:
    get:
      operationId: listProviders
      tags: [Providers]
      summary: List provider instances
      description: Provider credential values are never returned. Requires provider:read when OIDC scope authorization is enabled.
      responses:
        '200':
          description: Provider metadata.
          content:
            application/json:
              schema:
                type: object
                required: [providers]
                properties:
                  providers:
                    type: array
                    items:
                      $ref: '#/components/schemas/Provider'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/providers/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getProvider
      tags: [Providers]
      summary: Read provider metadata
      description: Credential values are never returned. Requires provider:read when OIDC scope authorization is enabled.
      responses:
        '200':
          description: Provider metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Provider'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: upsertProvider
      tags: [Providers]
      summary: Create or replace a provider instance
      description: Credential values are write-only and stored encrypted when local credential storage is configured. Requires provider:write when OIDC scope authorization is enabled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderWrite'
      responses:
        '204':
          description: Provider was saved.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: Credential encryption service is unavailable.
          content:
            text/plain:
              schema:
                type: string
    delete:
      operationId: deleteProvider
      tags: [Providers]
      summary: Delete a provider instance
      description: Requires provider:write when OIDC scope authorization is enabled.
      responses:
        '204':
          description: Provider was deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/inference:
    get:
      operationId: getInferenceRoute
      tags: [Configuration]
      summary: Read the configured inference route
      responses:
        '200':
          description: Inference route.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceRoute'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: setInferenceRoute
      tags: [Configuration]
      summary: Configure the inference route
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InferenceRouteInput'
      responses:
        '200':
          description: Saved inference route.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceRoute'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      operationId: clearInferenceRoute
      tags: [Configuration]
      summary: Clear the inference route
      responses:
        '204':
          description: Inference route was cleared.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/settings:
    get:
      operationId: listSettings
      tags: [Configuration]
      summary: List gateway settings
      responses:
        '200':
          description: Settings keyed by name.
          content:
            application/json:
              schema:
                type: object
                required: [settings]
                properties:
                  settings:
                    type: object
                    additionalProperties:
                      type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/settings/{key}:
    parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getSetting
      tags: [Configuration]
      summary: Read one gateway setting
      responses:
        '200':
          description: Setting value.
          content:
            application/json:
              schema:
                type: object
                required: [key, value]
                properties:
                  key:
                    type: string
                  value:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: setSetting
      tags: [Configuration]
      summary: Set one gateway setting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value:
                  type: string
      responses:
        '204':
          description: Setting was saved.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      operationId: deleteSetting
      tags: [Configuration]
      summary: Delete one gateway setting
      responses:
        '204':
          description: Setting was deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/templates:
    get:
      operationId: listTemplates
      tags: [Configuration]
      summary: List workload templates
      responses:
        '200':
          description: Template records.
          content:
            application/json:
              schema:
                type: object
                required: [templates]
                properties:
                  templates:
                    type: array
                    items:
                      $ref: '#/components/schemas/Template'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/templates/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getTemplate
      tags: [Configuration]
      summary: Read a workload template
      responses:
        '200':
          description: Template record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: upsertTemplate
      tags: [Configuration]
      summary: Create or replace a workload template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Template'
      responses:
        '204':
          description: Template was saved.
        '400':
