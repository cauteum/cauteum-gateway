  /v1/workspaces/{name}/members/{subject}:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
      - name: subject
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: removeWorkspaceMember
      tags: [Workspaces]
      summary: Remove a workspace member
      responses:
        '204':
          description: Member was removed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/whoami:
    get:
      operationId: getCurrentIdentity
      tags: [Gateway]
      summary: Read the authenticated caller identity
      responses:
        '200':
          description: Caller identity and authorization context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/ssh-sessions:
    get:
      operationId: listSSHSessions
      tags: [Sandboxes]
      summary: List SSH sessions
      parameters:
        - name: sandbox
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Active and revoked session records.
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: '#/components/schemas/SSHSessionInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/ssh-sessions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: revokeSSHSession
      tags: [Sandboxes]
      summary: Revoke an SSH session
      responses:
        '204':
          description: Session revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/providers/{name}/refresh:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getProviderRefreshConfig
      tags: [Providers]
      summary: Read redacted credential refresh configuration
      responses:
        '200':
          description: Refresh configuration with secret material redacted.
          content:
            application/json:
              schema:
                type: object
                required: [refresh]
                properties:
                  refresh:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/ProviderRefreshConfig'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/providers/{name}/refresh/{key}:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
      - name: key
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: configureProviderCredentialRefresh
      tags: [Providers]
      summary: Configure automatic credential refresh
      description: Secret material is encrypted at rest when an encryption provider is configured.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderRefreshConfigInput'
      responses:
        '204':
          description: Refresh configuration saved.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: removeProviderCredentialRefresh
      tags: [Providers]
      summary: Remove automatic credential refresh configuration
      responses:
        '204':
          description: Refresh configuration removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/providers/{name}/refresh/{key}/rotate:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
      - name: key
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: rotateProviderCredential
      tags: [Providers]
      summary: Rotate a provider credential immediately
      responses:
        '204':
          description: Credential refresh completed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/auth/oidc:
    get:
      operationId: getOIDCConfiguration
      tags: [Gateway]
      summary: Read public OIDC client configuration
      security: []
      responses:
        '200':
          description: OIDC configuration. Available only when OIDC is configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OIDCConfiguration'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/auth/login:
    get:
      operationId: startLocalDevelopmentLogin
      tags: [Gateway]
      summary: Obtain a local development gateway token
      description: >-
        Available only to loopback clients. If redirect_uri is supplied, the
        token is placed in its query string; this is intended only for a local
        loopback callback and should not be copied into logs or browser history.
      security: []
      parameters:
        - name: redirect_uri
          in: query
          required: false
          schema:
            type: string
            format: uri
          description: Optional http://127.0.0.1 callback URL.
      responses:
        '200':
          description: Local development token response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocalLogin'
        '302':
          description: Redirect to the supplied loopback URL with token query parameter.
          headers:
            Location:
              schema:
                type: string
                format: uri
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT or local gateway token
  parameters:
    SandboxName:
      name: name
      in: path
      required: true
      description: Sandbox registry name.
      schema:
        type: string
  schemas:
    Identity:
      type: object
      required: [subject, auth, roles, scopes, idp, sandbox, gateway_id]
      properties:
        subject:
          type: string
        auth:
          type: string
        roles:
          type: array
          items:
            type: string
        scopes:
          type: array
          items:
            type: string
        idp:
          type: string
        sandbox:
          type: string
        gateway_id:
          type: string
    OIDCConfiguration:
      type: object
      required: [issuer, audience, client_id, allow_insecure_http, mode]
      properties:
        issuer:
          type: string
          format: uri
        audience:
          type: string
        client_id:
          type: string
        allow_insecure_http:
          type: boolean
        mode:
          type: string
          const: oidc
    LocalLogin:
      type: object
      required: [token, expires_at, mode]
      properties:
        token:
          type: string
          format: password
          description: Local development bearer token. Store securely and never log it.
        expires_at:
          type: string
          format: date-time
        mode:
          type: string
          const: local-dev
    SSHSessionInfo:
      type: object
      required: [id, sandbox, created_at_ms]
      properties:
        id:
          type: string
        sandbox:
          type: string
        subject:
          type: string
        created_at_ms:
          type: integer
          format: int64
        expires_at_ms:
          type: integer
          format: int64
        revoked:
          type: boolean
    ProviderRefreshConfigInput:
      type: object
      description: The credential key is supplied by the path; strategy defaults to env.
      properties:
        strategy:
          type: string
          enum: [env, oauth2-refresh-token, oauth2-client-credentials, aws-sts-assume-role]
        material:
          type: object
          writeOnly: true
          additionalProperties:
            type: string
        material_secret_keys:
          type: array
          items:
            type: string
        material_credential_keys:
          type: object
          additionalProperties:
            type: string
        outputs:
          type: object
          additionalProperties:
            type: string
        refresh_before_seconds:
          type: integer
          format: int64
        max_lifetime_seconds:
          type: integer
          format: int64
        expires_at_ms:
          type: integer
          format: int64
    ExecResult:
      type: object
      properties:
        stdout:
          type: string
        stderr:
          type: string
        exit_code:
          type: integer
          format: int32
    SandboxProvider:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
        env_vars:
          type: array
          items:
            type: string
    SSHSession:
      type: object
      required: [session_id, sandbox_id, token, gateway_scheme, gateway_host, gateway_port, expires_at_ms]
      properties:
        session_id:
          type: string
        sandbox_id:
          type: string
        token:
          type: string
          format: password
          description: Short-lived bearer credential. Store securely and never log it.
        gateway_scheme:
          type: string
          enum: [http, https]
        gateway_host:
          type: string
        gateway_port:
          type: integer
        expires_at_ms:
          type: integer
          format: int64
    Proposal:
      type: object
      required: [id, sandbox, status, created_at, decided_at]
      properties:
        id:
          type: string
        sandbox:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected]
        intent_summary:
          type: string
        rule_name:
          type: string
        rule_yaml:
          type: string
        rule_proto_json:
          type: string
        rationale:
          type: string
        security_notes:
          type: string
        confidence:
          type: number
          format: float
        review_token:
          type: string
          format: password
          description: Sensitive token used by OpenShell draft flows; never log or expose to untrusted clients.
        hosts:
          type: array
          items:
            type: string
        rejection_reason:
          type: string
        validation_result:
          type: string
        security_flagged:
          type: boolean
        created_at:
          type: string
          format: date-time
        decided_at:
          type: string
          format: date-time
    ProposalInput:
      type: object
      description: Sandbox is assigned from the path; id is required by the store.
      required: [id]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected]
        intent_summary:
          type: string
        rule_name:
          type: string
        rule_yaml:
          type: string
        rule_proto_json:
          type: string
        rationale:
          type: string
        security_notes:
          type: string
        confidence:
          type: number
          format: float
        review_token:
          type: string
          format: password
          writeOnly: true
          description: Sensitive OpenShell draft token; never log or expose to untrusted clients.
        hosts:
          type: array
          items:
            type: string
        rejection_reason:
          type: string
        validation_result:
          type: string
    Health:
      type: object
      required: [ok, gateway_id, time]
      properties:
        ok:
          type: boolean
        gateway_id:
          type: string
        time:
          type: string
          format: date-time
    GatewayInfo:
      type: object
      required: [gateway_id, sandbox_count, updated_at, data_dir, auth_mode, compute_drivers, credential_drivers]
      properties:
        gateway_id:
          type: string
        sandbox_count:
          type: integer
          minimum: 0
        updated_at:
          type: string
          format: date-time
        data_dir:
          type: string
        auth_mode:
          type: string
          enum: [local-dev, oidc]
        compute_drivers:
          type: array
          items:
            type: object
            additionalProperties: true
        credential_drivers:
          type: array
          items:
            type: string
    Sandbox:
      type: object
      description: >-
        Fields accepted by the registry upsert. This is not a create-runtime
        request; the route name supplies the record name and updated_at is
        assigned by the gateway.
      properties:
        name:
          type: string
        id:
          type: string
        runtime_id:
          type: string
        compute_driver:
          type: string
        image:
          type: string
        workspace:
          type: string
        network:
          type: string
        status:
          type: string
        supervisor_instance_id:
          type: string
        main_process_instance_id:
          type: string
        main_process_exit_code:
          type: integer
          format: int32
        main_process_finalized:
          type: boolean
        spec_json:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
        settings:
          type: object
          additionalProperties:
            type: string
        settings_revision:
          type: integer
          format: int64
        resource_version:
          type: integer
          format: int64
        annotations:
          type: object
          additionalProperties:
            type: string
        created_at:
          type: string
          format: date-time
        base_policy_yaml:
          type: string
        attached_providers:
          type: array
          items:
            type: string
        policy_rev:
          type: integer
        active_policy_version:
          type: integer
          format: int32
        policy_revisions:
          type: array
          items:
            $ref: '#/components/schemas/PolicyRevision'
        updated_at:
          type: string
          format: date-time
    SandboxRecord:
      allOf:
        - $ref: '#/components/schemas/Sandbox'
        - type: object
          required: [name, updated_at]
    Provider:
      type: object
      description: Provider metadata. Credential values are not included in responses.
      required: [name, type]
      properties:
        name:
          type: string
        type:
          type: string
        workspace:
          type: string
        env_vars:
          type: array
          items:
            type: string
        credential_driver:
          type: string
        credential_handles:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/CredentialHandle'
        credential_expires_at_ms:
          type: object
          additionalProperties:
            type: integer
            format: int64
        runtime_credentials:
          type: boolean
        config:
          type: object
          additionalProperties:
            type: string
        refresh:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ProviderRefreshConfig'
    ProviderWrite:
      allOf:
        - $ref: '#/components/schemas/Provider'
        - type: object
          properties:
            credentials:
              type: object
              writeOnly: true
              additionalProperties:
                type: string
    CredentialHandle:
      type: object
      required: [driver, handle]
      properties:
        driver:
          type: string
        handle:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
    ProviderRefreshConfig:
      type: object
      required: [credential_key, strategy]
      properties:
        credential_key:
          type: string
        strategy:
          type: string
          enum: [env, oauth2-refresh-token, oauth2-client-credentials, aws-sts-assume-role]
        material:
          type: object
          additionalProperties:
            type: string
        material_secret_keys:
          type: array
          items:
            type: string
        material_credential_keys:
          type: object
          additionalProperties:
            type: string
        outputs:
          type: object
          additionalProperties:
            type: string
        refresh_before_seconds:
          type: integer
          format: int64
        max_lifetime_seconds:
          type: integer
          format: int64
        expires_at_ms:
          type: integer
          format: int64
    InferenceRoute:
      type: object
      required: [provider]
      properties:
        provider:
          type: string
        model:
          type: string
        timeout_sec:
          type: integer
        version:
          type: integer
    InferenceRouteInput:
      type: object
      required: [provider, model]
      properties:
        provider:
          type: string
        model:
          type: string
        timeout_sec:
          type: integer
    Template:
      type: object
      properties:
        name:
          type: string
        workspace:
          type: string
        id:
          type: string
        spec_json:
          type: string
        created_at:
          type: string
          format: date-time
        resource_version:
          type: integer
          format: int64
        image:
          type: string
        from:
          type: string
        policy:
          type: string
        cpu:
          type: number
          format: double
        memory:
          type: string
        env:
          type: object
          additionalProperties:
            type: string
        providers:
          type: array
          items:
            type: string
        forwards:
          type: array
          items:
            type: integer
        labels:
          type: object
          additionalProperties:
            type: string
        yaml:
          type: string
    Service:
      type: object
      required: [name, sandbox, port, backend_host, backend_port, updated_at]
      properties:
        name:
          type: string
        sandbox:
          type: string
        port:
          type: integer
        backend_host:
          type: string
        backend_port:
          type: integer
        updated_at:
          type: string
          format: date-time
    ServiceInput:
      type: object
      properties:
        name:
          type: string
        sandbox:
          type: string
        port:
          type: integer
        backend_host:
          type: string
        backend_port:
          type: integer
    Workspace:
      type: object
      required: [name, created_at, updated_at]
