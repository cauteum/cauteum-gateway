# Control plane: cautem-gateway (+ optional Dex OIDC via profile).
#
# Local-dev (default):
#   docker compose -f cautem-gateway/compose/docker-compose.yml up -d --build
#   cautem gateway add http://127.0.0.1:7443 --local --name local
#
# With OIDC (Dex on :5556):
#   docker compose -f cautem-gateway/compose/docker-compose.yml \
#     -f cautem-gateway/compose/docker-compose.oidc.yml --profile oidc up -d --build
#   cautem gateway add http://127.0.0.1:7443 --local --name local \
#     --oidc-issuer http://127.0.0.1:5556/dex \
#     --oidc-client-id cautem-cli \
#     --oidc-allow-insecure-http
#   cautem gateway login   # admin@example.com / password
#
# Local control plane: durable state + optional OIDC gateway login.

services:
  cautem-gateway:
    build:
      context: ../..
      dockerfile: cautem-gateway/Dockerfile
    image: cautem-gateway:local
    ports:
      - "127.0.0.1:7443:7443"
    volumes:
      - cautem-gateway-data:/var/lib/cautem-gateway
    environment:
      CAUTEM_GATEWAY_DATA: /var/lib/cautem-gateway
      CAUTEM_SECRETS_KEK: ${CAUTEM_SECRETS_KEK:-}
      CAUTEM_OIDC_ISSUER: ${CAUTEM_OIDC_ISSUER:-}
      CAUTEM_OIDC_CLIENT_ID: ${CAUTEM_OIDC_CLIENT_ID:-}
      CAUTEM_OIDC_AUDIENCE: ${CAUTEM_OIDC_AUDIENCE:-}
      CAUTEM_OIDC_ALLOW_INSECURE_HTTP: ${CAUTEM_OIDC_ALLOW_INSECURE_HTTP:-}
    restart: unless-stopped
    # OpenShell Linux parity: sandbox/sidecar callback via host-gateway aliases.
    extra_hosts:
      - "host.cautem.internal:host-gateway"
      - "host.docker.internal:host-gateway"
    networks: [cautem]
    # HEALTHCHECK is optional; image may not ship wget — CLI uses /healthz via doctor.
  # Optional IdP for local OIDC login (profile: oidc).
  dex:
    profiles: ["oidc"]
    image: ghcr.io/dexidp/dex:v2.41.1
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    ports:
      - "127.0.0.1:5556:5556"
    volumes:
      - ./dex/config.yaml:/etc/dex/config.yaml:ro
    networks: [cautem]
    restart: unless-stopped

networks:
  cautem:
    driver: bridge

volumes:
  cautem-gateway-data:
