name: images-gateway

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - ".github/workflows/images-gateway.yml"
  pull_request:
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - ".github/workflows/images-gateway.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/whaleshell/whaleshell/gateway
  GOWORK: ${{ github.workspace }}/go.work

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gateway
        uses: actions/checkout@v4
        with:
          path: whaleshell-gateway
      - name: Checkout deps
        uses: actions/checkout@v4
        with:
          repository: whaleshell/whaleshell-core
          path: whaleshell-core
      - uses: actions/checkout@v4
        with:
          repository: whaleshell/whaleshell-providers
          path: whaleshell-providers
      - uses: actions/checkout@v4
        with:
          repository: whaleshell/whaleshell-runtime
          path: whaleshell-runtime
      - uses: actions/checkout@v4
        with:
          repository: whaleshell/whaleshell-proxy
          path: whaleshell-proxy
      - uses: actions/checkout@v4
        with:
          repository: whaleshell/whaleshell-driver
          path: whaleshell-driver
      - uses: actions/checkout@v4
        with:
          repository: whaleshell/whaleshell-sdk
          path: whaleshell-sdk

      - name: Checkout slogx
        uses: actions/checkout@v4
        with:
          repository: whaleshell/slogx
          path: slogx
      - name: Write go.work
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'go 1.27.0'
            echo 'use ('
            for d in whaleshell-* slogx; do
              if [[ -d "$d" ]]; then
                echo "  ./$d"
              fi
            done
            echo ')'
            echo 'replace ('
            for d in whaleshell-*; do
              if [[ -d "$d" ]]; then
                echo "  github.com/whaleshell/${d} v0.1.0-alpha.2 => ./$d"
              fi
            done
            if [[ -d slogx ]]; then
              echo '  github.com/whaleshell/slogx v0.1.0-alpha.2 => ./slogx'
            fi
            echo ')'
          } > "${{ github.workspace }}/go.work"
          echo "Wrote go.work:" && cat "${{ github.workspace }}/go.work"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: |
            whaleshell-*/go.sum
            slogx/go.sum
      - uses: docker/setup-buildx-action@v3
      - name: Login GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: whaleshell-gateway/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
