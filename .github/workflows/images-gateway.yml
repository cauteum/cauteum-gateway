name: images-gateway

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - ".github/workflows/images-gateway.yml"
  pull_request:
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - ".github/workflows/images-gateway.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/cautem/cauteum/gateway
  GOWORK: ${{ github.workspace }}/go.work

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gateway
        uses: actions/checkout@v4
        with:
          path: cauteum-gateway
      - name: Checkout deps
        uses: actions/checkout@v4
        with:
          repository: cautem/cauteum-core
          path: cauteum-core
      - uses: actions/checkout@v4
        with:
          repository: cautem/cauteum-cli
          path: cauteum-cli
          ref: 62263efb19f99f0ccc182ae6bb9179bdfab4e839
      - uses: actions/checkout@v4
        with:
          repository: cautem/cauteum-display
          path: cauteum-display
      - uses: actions/checkout@v4
        with:
          repository: cautem/cauteum-providers
          path: cauteum-providers
      - uses: actions/checkout@v4
        with:
          repository: cautem/cauteum-runtime
          path: cauteum-runtime
      - uses: actions/checkout@v4
        with:
          repository: cautem/cauteum-proxy
          path: cauteum-proxy
      - uses: actions/checkout@v4
        with:
          repository: cautem/cauteum-driver
          path: cauteum-driver
      - uses: actions/checkout@v4
        with:
          repository: cautem/cauteum-sdk
          path: cauteum-sdk

      - name: Checkout slogx
        uses: actions/checkout@v4
        with:
          repository: cautem/slogx
          path: cauteum-slogx
      - name: Write go.work
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'go 1.27.0'
            echo 'use ('
            for d in cauteum-* slogx; do
              if [[ -d "$d" ]]; then
                echo "  ./$d"
              fi
            done
            echo ')'
            echo 'replace ('
            for d in cauteum-*; do
              if [[ -d "$d" ]]; then
                echo "  github.com/cautem/${d} v0.1.0-alpha.1 => ./$d"
                echo "  github.com/cautem/${d} v0.1.0-alpha.2 => ./$d"
                echo "  github.com/cautem/${d} v0.1.0-beta.1 => ./$d"
                echo "  github.com/cautem/${d} v0.1.0-beta.2 => ./$d"
                echo "  github.com/cautem/${d} v0.1.5 => ./$d"
              fi
            done
            if [[ -d cauteum-slogx ]]; then
              echo '  github.com/cautem/slogx v0.1.0-alpha.1 => ./cauteum-slogx'
              echo '  github.com/cautem/slogx v0.1.0-alpha.2 => ./cauteum-slogx'
              echo '  github.com/cautem/slogx v0.1.0-beta.1 => ./cauteum-slogx'
              echo '  github.com/cautem/slogx v0.1.0-beta.2 => ./cauteum-slogx'
              echo '  github.com/cautem/slogx v0.1.3 => ./cauteum-slogx'
            fi
            echo ')'
          } > "${{ github.workspace }}/go.work"
          touch "${{ github.workspace }}/go.work.sum"
          echo "Wrote go.work:" && cat "${{ github.workspace }}/go.work"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
          cache: true
          cache-dependency-path: |
            cauteum-*/go.sum
            slogx/go.sum
      - uses: docker/setup-buildx-action@v3
      - name: Login GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cauteum-gateway/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
