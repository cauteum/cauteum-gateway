# gogpu-style CI: format, lint, cross-platform build + test
name: CI

env:
  CGO_ENABLED: "0"
  GOWORK: ${{ github.workspace }}/go.work

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write  # Codecov OIDC

jobs:
  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: whaleshell-gateway
    steps:

      - name: Checkout whaleshell-gateway
        uses: actions/checkout@v4
        with:
          path: whaleshell-gateway

      - name: Checkout whaleshell-cli
        uses: actions/checkout@v4
        with:
          repository: whaleshell/whaleshell-cli
          path: whaleshell-cli
          ref: main

      - name: Checkout whaleshell-core
        uses: actions/checkout@v4
        with:
          repository: whaleshell/whaleshell-core
          path: whaleshell-core
          ref: main

      - name: Checkout whaleshell-providers
        uses: actions/checkout@v4
        with:
          repository: whaleshell/whaleshell-providers
          path: whaleshell-providers
          ref: main

      - name: Checkout whaleshell-runtime
        uses: actions/checkout@v4
        with:
          repository: whaleshell/whaleshell-runtime
          path: whaleshell-runtime
          ref: main

      - name: Checkout whaleshell-driver
        uses: actions/checkout@v4
        with:
          repository: whaleshell/whaleshell-driver
          path: whaleshell-driver
          ref: main

      - name: Checkout whaleshell-proxy
        uses: actions/checkout@v4
        with:
          repository: whaleshell/whaleshell-proxy
          path: whaleshell-proxy
          ref: main

      - name: Checkout slogx
        uses: actions/checkout@v4
        with:
          repository: whaleshell/slogx
          path: slogx
      - name: Write go.work
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'go 1.27.0'
            echo 'use ('
            for d in whaleshell-* slogx; do
              if [[ -d "$d" ]]; then
                echo "  ./$d"
              fi
            done
            echo ')'
            echo 'replace ('
            for d in whaleshell-*; do
              if [[ -d "$d" ]]; then
                echo "  github.com/whaleshell/${d} v0.1.0-alpha.1 => ./$d"
                echo "  github.com/whaleshell/${d} v0.1.0-alpha.2 => ./$d"
              fi
            done
            if [[ -d slogx ]]; then
              echo '  github.com/whaleshell/slogx v0.1.0-alpha.1 => ./slogx'
              echo '  github.com/whaleshell/slogx v0.1.0-alpha.2 => ./slogx'
            fi
            echo ')'
          } > "${{ github.workspace }}/go.work"
          echo "Wrote go.work:" && cat "${{ github.workspace }}/go.work"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: |
            whaleshell-*/go.sum
            slogx/go.sum
      - name: Check gofmt
        run: |
          set -euo pipefail
          bad="$(gofmt -l .)"
          if [[ -n "$bad" ]]; then
            echo "ERROR: not formatted:"
            echo "$bad"
            exit 1
          fi
          echo "gofmt: ok"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: whaleshell-gateway
    steps:

      - name: Checkout whaleshell-gateway
        uses: actions/checkout@v4
        with:
          path: whaleshell-gateway

      - name: Checkout whaleshell-cli
        uses: actions/checkout@v4
        with:
          repository: whaleshell/whaleshell-cli
          path: whaleshell-cli
          ref: main

      - name: Checkout whaleshell-core
        uses: actions/checkout@v4
        with:
          repository: whaleshell/whaleshell-core
          path: whaleshell-core
          ref: main

      - name: Checkout whaleshell-providers
        uses: actions/checkout@v4
        with:
          repository: whaleshell/whaleshell-providers
          path: whaleshell-providers
          ref: main

      - name: Checkout whaleshell-runtime
        uses: actions/checkout@v4
        with:
          repository: whaleshell/whaleshell-runtime
          path: whaleshell-runtime
          ref: main

      - name: Checkout whaleshell-driver
        uses: actions/checkout@v4
        with:
          repository: whaleshell/whaleshell-driver
          path: whaleshell-driver
          ref: main

      - name: Checkout whaleshell-proxy
        uses: actions/checkout@v4
        with:
          repository: whaleshell/whaleshell-proxy
          path: whaleshell-proxy
          ref: main

      - name: Checkout slogx
        uses: actions/checkout@v4
        with:
          repository: whaleshell/slogx
          path: slogx
      - name: Write go.work
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'go 1.27.0'
            echo 'use ('
            for d in whaleshell-* slogx; do
              if [[ -d "$d" ]]; then
                echo "  ./$d"
              fi
            done
            echo ')'
            echo 'replace ('
            for d in whaleshell-*; do
              if [[ -d "$d" ]]; then
                echo "  github.com/whaleshell/${d} v0.1.0-alpha.1 => ./$d"
                echo "  github.com/whaleshell/${d} v0.1.0-alpha.2 => ./$d"
              fi
            done
            if [[ -d slogx ]]; then
              echo '  github.com/whaleshell/slogx v0.1.0-alpha.1 => ./slogx'
              echo '  github.com/whaleshell/slogx v0.1.0-alpha.2 => ./slogx'
            fi
            echo ')'
          } > "${{ github.workspace }}/go.work"
          echo "Wrote go.work:" && cat "${{ github.workspace }}/go.work"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: |
            whaleshell-*/go.sum
            slogx/go.sum
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
          working-directory: whaleshell-gateway
          args: --timeout=5m

  build:
    name: Build - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: whaleshell-gateway
    steps:

      - name: Checkout whaleshell-gateway
        uses: actions/checkout@v4
        with:
          path: whaleshell-gateway

      - name: Checkout whaleshell-cli
        uses: actions/checkout@v4
        with:
          repository: whaleshell/whaleshell-cli
          path: whaleshell-cli
          ref: main

      - name: Checkout whaleshell-core
        uses: actions/checkout@v4
        with:
          repository: whaleshell/whaleshell-core
          path: whaleshell-core
          ref: main

      - name: Checkout whaleshell-providers
        uses: actions/checkout@v4
        with:
          repository: whaleshell/whaleshell-providers
          path: whaleshell-providers
          ref: main

      - name: Checkout whaleshell-runtime
        uses: actions/checkout@v4
        with:
          repository: whaleshell/whaleshell-runtime
          path: whaleshell-runtime
          ref: main

      - name: Checkout whaleshell-driver
        uses: actions/checkout@v4
        with:
          repository: whaleshell/whaleshell-driver
          path: whaleshell-driver
          ref: main

      - name: Checkout whaleshell-proxy
        uses: actions/checkout@v4
        with:
          repository: whaleshell/whaleshell-proxy
          path: whaleshell-proxy
          ref: main

      - name: Checkout slogx
        uses: actions/checkout@v4
        with:
          repository: whaleshell/slogx
          path: slogx
      - name: Write go.work
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'go 1.27.0'
            echo 'use ('
            for d in whaleshell-* slogx; do
              if [[ -d "$d" ]]; then
                echo "  ./$d"
              fi
            done
            echo ')'
            echo 'replace ('
            for d in whaleshell-*; do
              if [[ -d "$d" ]]; then
                echo "  github.com/whaleshell/${d} v0.1.0-alpha.1 => ./$d"
                echo "  github.com/whaleshell/${d} v0.1.0-alpha.2 => ./$d"
              fi
            done
            if [[ -d slogx ]]; then
              echo '  github.com/whaleshell/slogx v0.1.0-alpha.1 => ./slogx'
              echo '  github.com/whaleshell/slogx v0.1.0-alpha.2 => ./slogx'
            fi
            echo ')'
          } > "${{ github.workspace }}/go.work"
          echo "Wrote go.work:" && cat "${{ github.workspace }}/go.work"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: |
            whaleshell-*/go.sum
            slogx/go.sum
      - name: Download modules
        run: go mod download
      - name: Build
        run: go build ./...

  test:
    name: Test - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: whaleshell-gateway
    steps:

      - name: Checkout whaleshell-gateway
        uses: actions/checkout@v4
        with:
          path: whaleshell-gateway

      - name: Checkout whaleshell-cli
        uses: actions/checkout@v4
        with:
          repository: whaleshell/whaleshell-cli
          path: whaleshell-cli
          ref: main

      - name: Checkout whaleshell-core
        uses: actions/checkout@v4
        with:
          repository: whaleshell/whaleshell-core
          path: whaleshell-core
          ref: main

      - name: Checkout whaleshell-providers
        uses: actions/checkout@v4
        with:
          repository: whaleshell/whaleshell-providers
          path: whaleshell-providers
          ref: main

      - name: Checkout whaleshell-runtime
        uses: actions/checkout@v4
        with:
          repository: whaleshell/whaleshell-runtime
          path: whaleshell-runtime
          ref: main

      - name: Checkout whaleshell-driver
        uses: actions/checkout@v4
        with:
          repository: whaleshell/whaleshell-driver
          path: whaleshell-driver
          ref: main

      - name: Checkout whaleshell-proxy
        uses: actions/checkout@v4
        with:
          repository: whaleshell/whaleshell-proxy
          path: whaleshell-proxy
          ref: main

      - name: Checkout slogx
        uses: actions/checkout@v4
        with:
          repository: whaleshell/slogx
          path: slogx
      - name: Write go.work
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'go 1.27.0'
            echo 'use ('
            for d in whaleshell-* slogx; do
              if [[ -d "$d" ]]; then
                echo "  ./$d"
              fi
            done
            echo ')'
            echo 'replace ('
            for d in whaleshell-*; do
              if [[ -d "$d" ]]; then
                echo "  github.com/whaleshell/${d} v0.1.0-alpha.1 => ./$d"
                echo "  github.com/whaleshell/${d} v0.1.0-alpha.2 => ./$d"
              fi
            done
            if [[ -d slogx ]]; then
              echo '  github.com/whaleshell/slogx v0.1.0-alpha.1 => ./slogx'
              echo '  github.com/whaleshell/slogx v0.1.0-alpha.2 => ./slogx'
            fi
            echo ')'
          } > "${{ github.workspace }}/go.work"
          echo "Wrote go.work:" && cat "${{ github.workspace }}/go.work"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: |
            whaleshell-*/go.sum
            slogx/go.sum
      - name: Download modules
        run: go mod download
      - name: Vet
        if: matrix.os == 'ubuntu-latest'
        run: go vet ./...
      - name: Test (race + coverage)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 -coverprofile=coverage.txt -covermode=atomic ./...
      - name: Test (race)
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 ./...
      - name: Test
        if: matrix.os == 'windows-latest'
        shell: bash
        run: go test -count=1 ./...
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: ./whaleshell-gateway/coverage.txt
          flags: unittests
          name: codecov-whaleshell-gateway
          fail_ci_if_error: false
