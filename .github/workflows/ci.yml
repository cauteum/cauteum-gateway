      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
          working-directory: cauteum-gateway
          args: --timeout=5m

  build:
    name: Build - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: cauteum-gateway
    steps:

      - name: Checkout cauteum-gateway
