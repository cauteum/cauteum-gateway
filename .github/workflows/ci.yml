# gogpu-style CI: format, lint, cross-platform build + test
name: CI

env:
  CGO_ENABLED: "0"
  GOWORK: ${{ github.workspace }}/go.work

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write  # Codecov OIDC

jobs:
  api-contract:
    name: API contracts
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    defaults:
      run:
        working-directory: cauteum-gateway
    steps:
      - uses: actions/checkout@v4
        with:
          path: cauteum-gateway
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Lint OpenAPI document
        run: npx --yes @redocly/cli@2.60.0 lint api/openapi.yaml --config api/redocly.yaml
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
          cache-dependency-path: cauteum-gateway/go.sum
      - name: Install pinned Buf CLI
        run: go install github.com/bufbuild/buf/cmd/buf@v1.66.0
      - name: Lint and regenerate Control API
        run: |
          buf lint
          buf breaking --against api/schema/control-5e20fa2f6943.binpb
          buf generate
          if [[ -n "$(git status --porcelain -- api/gen)" ]]; then
            echo "generated Control API code is stale"
            git status --short -- api/gen
            exit 1
          fi
      - name: Build generated TypeScript client
        run: |
          npm ci --prefix api/typescript
          npm run check --prefix api/typescript
          if [[ -n "$(git status --porcelain -- api/typescript/src/gen)" ]]; then
            echo "generated TypeScript client is stale"
            git status --short -- api/typescript/src/gen
            exit 1
          fi
      - name: Build management UI
        run: |
          npm ci --prefix ui
          npm run build --prefix ui
      - name: Check Control API compatibility
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main:refs/heads/main
          if git cat-file -e main:buf.yaml 2>/dev/null; then
            buf breaking --against '.git#branch=main'
          fi

  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cauteum-gateway
    steps:

      - name: Checkout cauteum-gateway
        uses: actions/checkout@v4
        with:
          path: cauteum-gateway

      - name: Checkout cauteum-cli
        uses: actions/checkout@v4
        with:
          repository: cautem/cauteum-cli
          path: cauteum-cli
          ref: 62263efb19f99f0ccc182ae6bb9179bdfab4e839

      - name: Checkout cauteum-core
        uses: actions/checkout@v4
        with:
          repository: cautem/cauteum-core
          path: cauteum-core
          ref: 683b09a16a93e93ca860ea0c723baa369a3b5c75

      - name: Checkout cauteum-providers
        uses: actions/checkout@v4
        with:
          repository: cautem/cauteum-providers
          path: cauteum-providers
          ref: 4748976c3d5e382a9373a772c15bdbf396f302aa

      - name: Checkout cauteum-runtime
        uses: actions/checkout@v4
        with:
          repository: cautem/cauteum-runtime
          path: cauteum-runtime
          ref: 7841be657c5956bbc2f61655d776a5fd8c07101b

      - name: Checkout cauteum-driver
        uses: actions/checkout@v4
        with:
          repository: cautem/cauteum-driver
          path: cauteum-driver
          ref: b37c16cb3f7265d3effd24da93522be695e5e63a

      - name: Checkout cauteum-proxy
        uses: actions/checkout@v4
        with:
          repository: cautem/cauteum-proxy
          path: cauteum-proxy
          ref: c9ab3b42f5fd7dd8276bec491e50b35f54499082

      - name: Checkout slogx
        uses: actions/checkout@v4
        with:
          repository: cautem/slogx
          path: slogx
      - name: Write go.work
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'go 1.27.0'
            echo 'use ('
            for d in cauteum-* slogx; do
              [[ "$d" == cauteum-cli || "$d" == cauteum-display ]] && continue
              if [[ -d "$d" ]]; then
                echo "  ./$d"
              fi
            done
            echo ')'
            echo 'replace ('
            for d in cauteum-*; do
              [[ "$d" == cauteum-cli || "$d" == cauteum-display ]] && continue
              if [[ -d "$d" ]]; then
                echo "  github.com/cautem/${d} v0.1.0-alpha.1 => ./$d"
                echo "  github.com/cautem/${d} v0.1.0-alpha.2 => ./$d"
                echo "  github.com/cautem/${d} v0.1.0-beta.1 => ./$d"
                echo "  github.com/cautem/${d} v0.1.0-beta.2 => ./$d"
                echo "  github.com/cautem/${d} v0.1.5 => ./$d"
              fi
            done
            if [[ -d slogx ]]; then
              echo '  github.com/cautem/slogx v0.1.0-alpha.1 => ./slogx'
              echo '  github.com/cautem/slogx v0.1.0-alpha.2 => ./slogx'
              echo '  github.com/cautem/slogx v0.1.0-beta.1 => ./slogx'
              echo '  github.com/cautem/slogx v0.1.0-beta.2 => ./slogx'
              echo '  github.com/cautem/slogx v0.1.3 => ./slogx'
            fi
            echo ')'
          } > "${{ github.workspace }}/go.work"
          echo "Wrote go.work:" && cat "${{ github.workspace }}/go.work"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
          cache: true
          cache-dependency-path: |
            cauteum-*/go.sum
            slogx/go.sum
      - name: Check gofmt
        run: |
          set -euo pipefail
          bad="$(gofmt -l .)"
          if [[ -n "$bad" ]]; then
            echo "ERROR: not formatted:"
            echo "$bad"
            exit 1
          fi
          echo "gofmt: ok"

